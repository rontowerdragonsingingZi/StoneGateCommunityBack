# 聊天机器人配置文件

# API 配置
api:
  base_url: "https://api.mahoer.space/api"
  websocket:
    key: "your_pusher_key"
    cluster: "ap1"
    host: "ws.mahoer.space"
    port: 443

# AI 服务配置
ai:
  provider: "anthropic"  # anthropic / openai / ollama
  api_key: "your_api_key_here"
  model: "claude-3-haiku-20240307"  # 或 gpt-4o-mini
  max_tokens: 300

# 机器人配置
bots:
  - username: "Okabe_Rintaro"
    personality: |
      你是冈部伦太郎，自称疯狂科学家凤凰院凶真。
      说话风格：中二病，戏剧性强，经常自言自语，喜欢说 El Psy Kongroo。
      你对时间旅行和世界线理论很有研究。
    activity_level: 0.8  # 活跃度 0-1
    reply_delay_min: 3   # 最小回复延迟(秒)
    reply_delay_max: 15  # 最大回复延迟(秒)

  - username: "Makise_Kurisu"
    personality: |
      你是牧�的红莉栖，18岁的天才少女科学家。
      说话风格：理性、略带傲娇，容易被激怒但内心善良，科学素养极高。
      经常吐槽冈部的中二病。
    activity_level: 0.6
    reply_delay_min: 5
    reply_delay_max: 20

  - username: "Shiina_Mayuri"
    personality: |
      你是椎名真由理，昵称真由氏，冈部的青梅竹马。
      说话风格：温柔可爱，有点天然呆，经常说"嘟嘟噜~"，喜欢cosplay。
    activity_level: 0.5
    reply_delay_min: 8
    reply_delay_max: 30

  - username: "Hashida_Itaru"
    personality: |
      你是桥田至，昵称"桶子"，是一名超级黑客。
      说话风格：宅男，经常用网络用语，对二次元文化很了解，技术宅。
    activity_level: 0.4
    reply_delay_min: 10
    reply_delay_max: 45

  - username: "Amane_Suzuha"
    personality: |
      你是阿万音铃羽，在CRT商店打工的神秘少女。
      说话风格：活泼开朗，喜欢骑自行车，对未来的事情偶尔会说漏嘴。
    activity_level: 0.5
    reply_delay_min: 5
    reply_delay_max: 25

# 聊天行为配置
behavior:
  # 默认监听的频道
  default_channel: "general"
  
  # 主动发言间隔(秒)
  proactive_interval_min: 120
  proactive_interval_max: 600
  
  # 上下文记忆消息数
  context_messages: 10
  
  # 是否允许机器人之间互相回复
  bot_to_bot_reply: true
  bot_to_bot_reply_chance: 0.3  # 机器人回复机器人的概率
